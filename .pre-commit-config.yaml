repos:
  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests
        entry: python -c "import sys, unittest; sys.path.insert(0, 'src'); suite = unittest.defaultTestLoader.discover('tests', pattern='*test*.py', top_level_dir='.'); result = unittest.TextTestRunner().run(suite); sys.exit(0 if result.wasSuccessful() else 1)"
        language: system
        pass_filenames: false
        always_run: true
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        args: ["--config-file=pyproject.toml", "."]
